version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ziva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ziva_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ziva}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ziva}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Rust Sidecar (zingolib) ──────────────────────────────────
  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LIGHTWALLETD_HOST: ${LIGHTWALLETD_HOST:-testnet.zec.rocks}
      LIGHTWALLETD_PORT: ${LIGHTWALLETD_PORT:-443}
      LIGHTWALLETD_TLS: ${LIGHTWALLETD_TLS:-true}
      WALLET_SEED: ${WALLET_SEED:-}
      SIDECAR_PORT: ${SIDECAR_PORT:-3001}
    ports:
      - "3001:3001"
    volumes:
      - wallet_data:/app/wallet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── FastAPI Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ziva}:${POSTGRES_PASSWORD:-ziva_dev_password}@postgres:5432/${POSTGRES_DB:-ziva}
      SIDECAR_URL: http://sidecar:3001
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Next.js Dashboard ────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  wallet_data:
