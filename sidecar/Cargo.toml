[package]
name = "ziva-sidecar"
version = "0.1.0"
edition = "2021"
description = "ZIVA Rust sidecar — Axum HTTP wrapper around zingolib for shielded Zcash testnet transactions"

[dependencies]
# Zcash wallet library — pinned to v6.0.0 tag
# NOTE: zingolib requires Rust edition 2024 internally; we set our package to 2021
# but zingolib's own code uses 2024. Requires rustc >= 1.85.
zingolib   = { git = "https://github.com/zingolabs/zingolib.git", tag = "zingolib_v6.0.0" }
zingoconfig = { git = "https://github.com/zingolabs/zingolib.git", tag = "zingolib_v6.0.0" }

# HTTP server
axum       = { version = "0.7", features = ["json", "http1", "tokio"] }
tokio      = { version = "1", features = ["full"] }
tower      = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow     = "1"
uuid       = { version = "1", features = ["v4"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy    = "0.15"

# Build prerequisites:
# Linux/Mac: protobuf-compiler, clang, libclang-dev
# Windows:   scoop install protobuf  OR  choco install protoc
