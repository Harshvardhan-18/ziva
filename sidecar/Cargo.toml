[package]
name = "ziva-sidecar"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zingolib = "0.1" # Note: version may need adjustment based on exact latest
zingoconfig = "0.1"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4"] }
reqwest = "0.12"
dotenvy = "0.15"
