[package]
name = "ziva-sidecar"
version = "0.1.0"
edition = "2021"
description = "ZIVA Rust sidecar — Axum HTTP wrapper around zingolib for shielded Zcash testnet transactions"

[dependencies]
# Zcash wallet library from local workspace
zingolib = { path = "../../zingolib/zingolib" }
pepper-sync = { path = "../../zingolib/pepper-sync" }

# HTTP server
axum       = { version = "0.7", features = ["json", "http1", "tokio"] }
tokio      = { version = "1", features = ["full"] }
tower      = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
anyhow     = "1"
uuid       = { version = "1", features = ["v4"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy    = "0.15"
http       = "1"

# Protocol types matching zingolib v6.0.0
zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.7", features = ["orchard", "transparent-inputs"] }
zcash_protocol = "0.10.4"
zip32 = "0.2.0"

[patch.crates-io]
# Required for NU6.3 / Ironwood proto fields used by pepper-sync
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
