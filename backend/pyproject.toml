[project]
name = "ziva-backend"
version = "0.1.0"
description = "ZIVA FastAPI Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "pydantic>=2.0.0",
    "python-dotenv",
    "langgraph",
    "langchain-openai",
    "langchain-core",
    "typesafe-sdk",
    "httpx",
    "python-jose[cryptography]",
    "passlib"
]
